name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://petshop_app:petshop_app@localhost:5432/petshop
      DATABASE_URL_OWNER: postgres://petshop_owner:petshop_owner@localhost:5432/petshop
      TEST_DATABASE_URL: postgres://petshop_app:petshop_app@localhost:5432/petshop_test
      TEST_DATABASE_URL_OWNER: postgres://petshop_owner:petshop_owner@localhost:5432/petshop_test
      TEST_DATABASE_URL_SUPERUSER: postgres://postgres:postgres@localhost:5432/petshop_test
      STRIPE_SUPPRESS_NOTICES: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bancos de teste
        run: ./scripts/dev-db.sh && pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm --filter @petshop/web build && pnpm --filter @petshop/worker build
        env:
          BETTER_AUTH_SECRET: ci-segredo-apenas-para-testes-0123456789
      - name: Navegador do Playwright
        run: pnpm --filter @petshop/web exec playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: pnpm e2e
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-segredo-apenas-para-testes-0123456789
          BILLING_PROVIDER: fake
          MESSAGING_PROVIDER: fake
          FAKE_WHATSAPP_CONNECT_MS: "4000"
          PLATFORM_ADMIN_EMAILS: dono@exemplo.com.br
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
